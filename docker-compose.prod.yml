# Production-like stack: nginx serves frontend and proxies /api to backend
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      USE_POSTGRES: "1"
      POSTGRES_HOST: db
      POSTGRES_DB: warehouse_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
